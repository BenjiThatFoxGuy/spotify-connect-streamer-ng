services:
  # --- Embedded mode (default, recommended) ---
  # No icecast needed. The streamer serves audio directly.
  streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-streamer-ng
    restart: unless-stopped
    # Zeroconf (LAN) discovery needs to see the real network to be found by
    # the Spotify app, so we run this service on the host network instead of
    # the default bridge. If you're using remote (username/password) mode
    # only, you can drop this and rely on normal bridge networking + port
    # publishing instead.
    network_mode: host
    volumes:
      - spot-cache:/tmp/spot-cache
    # Share ALSA devices into the container. Only needed if you set
    # BACKEND=alsa; the default pipe backend doesn't touch ALSA at all.
    devices:
      - /dev/snd:/dev/snd
    environment:
      DEVICE_NAME: "${DEVICE_NAME:-Stream Output}"
      DEVICE_TYPE: "${DEVICE_TYPE:-speaker}"
      LISTEN_ADDR: "${LISTEN_ADDR:-:8080}"
      CACHE_DIR: "/tmp/spot-cache"
      MP3_BITRATE: "${MP3_BITRATE:-320k}"
      AUTH_MODE: "${AUTH_MODE:-zeroconf}"
      LIBRESPOT_EXTRA_ARGS: "${LIBRESPOT_EXTRA_ARGS:-}"
      SPOTIFY_USERNAME: "${SPOTIFY_USERNAME:-}"
      SPOTIFY_PASSWORD: "${SPOTIFY_PASSWORD:-}"
      # To use icecast mode instead of embedded, set ICECAST_URL:
      # ICECAST_URL: "icecast://source:hackme@localhost:8000/stream.mp3"

volumes:
  spot-cache:
